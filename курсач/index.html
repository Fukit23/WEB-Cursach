<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <div class="logo">AppFusion</div>
    <nav>
        <a href="#">Каталог</a>
        <a href="#">Бібліотека</a>
    </nav>
</header>

<main class="container" id="app-list"></main>

<script>
    function getIconUrl(id) {
        return `https://picsum.photos/id/${id}/80/80`;
    }

    async function fetchApps() {
        try {
            const res = await fetch('get_apps.php');
            if (!res.ok) throw new Error('Помилка сервера');
            
            const apps = await res.json();
            const list = document.getElementById('app-list');
            
            list.innerHTML = apps.map(app => `
                <div class="app-card">
                    <img src="${getIconUrl(app.icon_id)}" alt="${app.name}">
                    <h3>${app.name}</h3>
                    <p>${app.description}</p>
                    <div class="version-badge">Версія: ${app.type}</div>
                    <div class="price-tag">${app.price}₴</div>
                    <button class="btn-main" onclick="window.open('${app.download_link}', '_blank')">
                        Завантажити
                    </button>
                </div>
            `).join('');
        } catch (e) {
            document.getElementById('app-list').innerHTML = '<p>Не вдалося завантажити додатки.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', fetchApps);
</script>

</body>
</html>
